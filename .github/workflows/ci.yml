name: Quality checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Scan tracked files for secrets
        run: npm run check:secrets

      - name: Reject retired deployment hostnames
        run: |
          # Match any get-to-it Vercel alias, then allow only current production.
          # Bracketed dots keep these patterns from matching their own source lines.
          current_host='get-to-it-wvpy[.]vercel[.]app'
          vercel_host='get-to-it(-[a-z0-9-]+)?[.]vercel[.]app'
          set +e
          # DEPLOYMENT.md is the audit record and intentionally names retired hosts.
          matches=$(git grep -n -I -i -E "$vercel_host" -- . ':!DEPLOYMENT.md')
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            echo "::error::Could not scan tracked files for deployment hostnames."
            exit "$status"
          fi
          if [ "$status" -eq 0 ]; then
            stale=$(printf '%s\n' "$matches" | awk -v current="$current_host" -v candidate="$vercel_host" '{ lower = tolower($0); gsub(tolower(current), "", lower); if (lower ~ candidate) print $0 }')
            if [ -n "$stale" ]; then
              printf '%s\n' "$stale"
              echo "::error::A retired get-to-it Vercel hostname is referenced. Use the current production URL from DEPLOYMENT.md."
              exit 1
            fi
          fi
          echo "No retired deployment hostnames found."

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Replays every migration into a throwaway Postgres and checks the Phase 37
      # rules: verification, workspace isolation, transfer approval, retraction,
      # retention purge and the deletion cascades. No project secret is used.
      - name: Phase 37 knowledge harness
        run: npm run test:knowledge

      # Replays every migration again, then checks export/import, cross-account
      # isolation and account deletion. Also runs on its own embedded Postgres.
      - name: Restore and authorization drill
        run: npm run test:restore

      # Static check over the latest function definitions: a role guard that can
      # pass when the caller has no role fails the build.
      - name: Role guard audit
        run: npm run check:role-guards

      # A guard that compares a parameter against a value list must reject a
      # missing parameter instead of letting the NULL reach the column.
      - name: Nullable guard audit
        run: npm run check:nullable-guards

      # Compares live function bodies with the migrations when a direct database
      # URL is configured; skips cleanly when the secret is absent.
      - name: Schema drift check
        run: npm run check:schema-drift
        env:
          # Either a direct URL or the Management API with a project ref arms
          # this check; with neither it reports that it compared nothing.
          SCHEMA_DRIFT_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_MANAGEMENT_API: ${{ secrets.SUPABASE_MANAGEMENT_API }}
          SCHEMA_DRIFT_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
