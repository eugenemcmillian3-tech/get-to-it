name: Schedule production backup

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger production backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run production-backup.yml --repo "$GITHUB_REPOSITORY" --ref main
