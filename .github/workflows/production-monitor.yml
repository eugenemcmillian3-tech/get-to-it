name: Production monitor

on:
  schedule:
    # GitHub's shortest schedule interval; runs can be delayed.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: production-monitor
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Check production pages and API boundaries
        env:
          MONITOR_BASE_URL: https://get-to-it-wvpy.vercel.app
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/production-monitor.mjs
