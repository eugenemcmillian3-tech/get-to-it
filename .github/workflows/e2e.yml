name: Authenticated E2E

on:
  schedule:
    # Every Monday at 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      full_workflow:
        description: Run the AI draft, review and checkpoint smoke test
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: authenticated-e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authenticated-e2e:
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_BASE_URL: http://127.0.0.1:3100
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify E2E configuration
        env:
          E2E_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=0
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY E2E_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured. Add the E2E Supabase secrets described in README.md."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify full workflow configuration
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_workflow) }}
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          if [ -z "$OLLAMA_API_KEY" ]; then
            echo "::error::The full workflow run requires the OLLAMA_API_KEY repository secret."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Start app
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          ./node_modules/.bin/next start -p 3100 > "$RUNNER_TEMP/app.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/app.pid"

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 5 "$E2E_BASE_URL/api/health" > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/app.pid")" 2> /dev/null; then
              echo "The app process exited before becoming healthy."
              cat "$RUNNER_TEMP/app.log"
              exit 1
            fi
            sleep 1
          done

          echo "The app did not become healthy within 60 seconds."
          cat "$RUNNER_TEMP/app.log"
          exit 1

      - name: Run authenticated crawl
        env:
          E2E_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:e2e

      - name: Run browser functional smoke
        env:
          E2E_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_FULL_WORKFLOW: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_workflow)) && '1' || '' }}
        run: npm run test:functional

      - name: Stop app
        if: always()
        run: |
          if [ ! -f "$RUNNER_TEMP/app.pid" ]; then
            exit 0
          fi

          pid="$(cat "$RUNNER_TEMP/app.pid")"
          if kill -0 "$pid" 2> /dev/null; then
            kill "$pid" 2> /dev/null || true
          fi
          for attempt in $(seq 1 10); do
            if ! kill -0 "$pid" 2> /dev/null; then
              exit 0
            fi
            sleep 1
          done
          kill -9 "$pid" 2> /dev/null || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: authenticated-e2e-diagnostics
          path: |
            ${{ runner.temp }}/app.log
            artifacts/e2e-functional-failure.png
          if-no-files-found: ignore
